<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Spoiler Blocker Settings</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #ffffff;
      color: #1a1a1a;
    }

    .header {
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px solid #e0e0e0;
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 12px;
      color: #666;
    }

    .toggle-section {
      margin-bottom: 20px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 8px;
    }

    .toggle-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .toggle-label {
      font-size: 14px;
      font-weight: 500;
      color: #1a1a1a;
    }

    .toggle-switch {
      position: relative;
      width: 48px;
      height: 24px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: 0.3s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #3ea6ff;
    }

    input:checked + .slider:before {
      transform: translateX(24px);
    }

    .settings-section {
      margin-bottom: 20px;
    }

    .setting-item {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #1a1a1a;
      margin-bottom: 6px;
    }

    .input-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="number"] {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #d0d0d0;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.2s;
    }

    input[type="number"]:focus {
      outline: none;
      border-color: #3ea6ff;
    }

    .unit {
      font-size: 13px;
      color: #666;
      min-width: 20px;
    }

    .description {
      font-size: 11px;
      color: #888;
      margin-top: 4px;
      line-height: 1.4;
    }

    .button-group {
      display: flex;
      gap: 8px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-save {
      background: #3ea6ff;
      color: white;
    }

    .btn-save:hover {
      background: #2d8fd8;
    }

    .btn-reset {
      background: #f0f0f0;
      color: #1a1a1a;
    }

    .btn-reset:hover {
      background: #e0e0e0;
    }

    .status-message {
      margin-top: 12px;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      text-align: center;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .status-message.show {
      opacity: 1;
    }

    .status-message.success {
      background: #e6f7e6;
      color: #1e7e34;
    }

    .info-box {
      margin-top: 20px;
      padding: 12px;
      background: #fff9e6;
      border-left: 3px solid #ffc107;
      border-radius: 4px;
      font-size: 11px;
      color: #856404;
      line-height: 1.5;
    }

    .info-box strong {
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
    }

    .radio-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }

    .radio-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      background: #f9f9f9;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .radio-option:hover {
      background: #f0f0f0;
    }

    .radio-option input[type="radio"] {
      cursor: pointer;
    }

    .radio-option label {
      cursor: pointer;
      margin: 0;
      font-size: 12px;
      font-weight: 400;
    }

    .coffee-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 16px;
      padding: 10px;
      background: linear-gradient(135deg, #ff813f, #ffdd00);
      border-radius: 8px;
      text-decoration: none;
      color: #000;
      font-size: 13px;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .coffee-link:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 129, 63, 0.4);
    }

    .coffee-link span {
      font-size: 16px;
    }

    .disabled-input {
      opacity: 0.5;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🎬 Spoiler Blocker</h1>
    <p class="subtitle">Block YouTube ending spoilers</p>
  </div>

  <div class="settings-section">
    <div class="setting-item">
      <div class="input-group">
        <input type="radio" id="modePercentage" name="thresholdMode" value="percentage" checked>
        <label for="modePercentage">Hide last X% of video</label>
      </div>
      <div class="input-group" id="percentageSection" style="margin-left: 24px; margin-top: 8px;">
        <input type="number" id="percentageThreshold" min="0" max="100" step="5" value="30">
        <span class="unit">%</span>
      </div>
    </div>

    <div class="setting-item">
      <div class="input-group">
        <input type="radio" id="modeTime" name="thresholdMode" value="time">
        <label for="modeTime">Hide last X minutes of video</label>
      </div>
      <div class="input-group" id="timeSection" style="margin-left: 24px; margin-top: 8px;">
        <input type="number" id="timeThreshold" min="0" max="120" step="1" value="10">
        <span class="unit">min</span>
      </div>
    </div>
  </div>

  <div class="status-message" id="statusMessage"></div>

  <div class="info-box">
    <strong>How it works</strong>
    The progress bar stops at the marker point. Choose either percentage or time-based threshold.
  </div>

  <a href="https://buymeacoffee.com/codingcat" target="_blank" class="coffee-link">
    <span>☕</span> Buy me a coffee
  </a>

  <script src="popup.js"></script>
</body>
</html>
